      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_ZOOKEEPER_PROTOCOL: SASL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/kafka-jaas.conf
        -Dauto.create.topics.enable=false
        -Dlog4j2.formatMsgNoLookups=true
    volumes:
      - ./fix-permissions.sh:/fix-permissions.sh
      - ./kafka/data/kafka-3:/var/lib/kafka/data
    command: >
      sh -c "
      echo 'Client {
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username=\"$$KAFKA_SASL_USER\"
        password=\"$$KAFKA_SASL_PASS\";
      };
      KafkaServer {
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username=\"$$KAFKA_SASL_USER\"
        password=\"$$KAFKA_SASL_PASS\"
        user_$$KAFKA_SASL_USER=\"$$KAFKA_SASL_PASS\";
      };' > /etc/kafka/kafka-jaas.conf &&
      /fix-permissions.sh
      "
    ports:
