      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_ZOOKEEPER_PROTOCOL: SASL
      KAFKA_SASL_MECHANISM: PLAIN
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/kafka-jaas.conf
        -Dauto.create.topics.enable=false
        -Dlog4j2.formatMsgNoLookups=true
    volumes:
      - ./fix-permissions.sh:/fix-permissions.sh
      - ./kafka/data/kafka-2:/var/lib/kafka/data
    command: >
      sh -c "
      echo 'Client {
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username=\"$$KAFKA_SASL_USER\"
        password=\"$$KAFKA_SASL_PASS\";
      };
      KafkaServer {
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username=\"$$KAFKA_SASL_USER\"
        password=\"$$KAFKA_SASL_PASS\"
        user_$$KAFKA_SASL_USER=\"$$KAFKA_SASL_PASS\";
      };' > /etc/kafka/kafka-jaas.conf &&
      /fix-permissions.sh
      "
    ports:
      - 29092:29092
    depends_on:
      zoo-1:
        condition: service_healthy
      zoo-2:
        condition: service_healthy
      zoo-3:
        condition: service_healthy
    networks:
      - kafka_network

  kafka-3:
    build:
      context: kafka
      args:
        KAFKA_SASL_USER: "${KAFKA_SASL_USER}"
        KAFKA_SASL_PASS: "${KAFKA_SASL_PASS}"
    container_name: kafka_3
    restart: always
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zoo-1:2181,zoo-2:2181,zoo-3:2181
      KAFKA_ADVERTISED_HOST_NAME: kafka-3
      KAFKA_ADVERTISED_LISTENERS: "SASL_PLAINTEXT://kafka-3:39092"
